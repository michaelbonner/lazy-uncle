name: PR Preview (Dokploy)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PREVIEW_HOST_SUFFIX: bootpack.work
  NEXT_PUBLIC_POSTHOG_HOST: /ingest

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute image name
        id: vars
        run: echo "image=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: michaelbonner
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.vars.outputs.image }}:pr-${{ github.event.number }}
            ${{ steps.vars.outputs.image }}:pr-${{ github.event.number }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ env.NEXT_PUBLIC_POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Once this file exists on master, always execute the trusted base-branch
      # copy because this step receives deployment and registry credentials.
      - name: Use trusted orchestration script
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          if git checkout "origin/${{ github.base_ref }}" -- scripts/dokploy-preview.mjs 2>/dev/null; then
            echo "Using scripts/dokploy-preview.mjs from ${{ github.base_ref }}"
          else
            echo "::warning::Preview script is not on the base branch yet; using this PR's bootstrap copy"
          fi

      - name: Create or update preview
        id: deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_TEMPLATE_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          GHCR_USERNAME: michaelbonner
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN }}
          PREVIEW_HOST_SUFFIX: ${{ env.PREVIEW_HOST_SUFFIX }}
          PR_NUMBER: ${{ github.event.number }}
          IMAGE: ${{ steps.vars.outputs.image }}:pr-${{ github.event.number }}-${{ github.sha }}
        run: node scripts/dokploy-preview.mjs deploy

      - name: Comment preview URL
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- dokploy-preview -->';
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const body = `${marker}\n🚀 **Preview deployed:** ${url}\n\n` +
              `_Built in GitHub Actions and deployed to Dokploy. It will be removed when this PR closes._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use trusted orchestration script
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          if git checkout "origin/${{ github.base_ref }}" -- scripts/dokploy-preview.mjs 2>/dev/null; then
            echo "Using scripts/dokploy-preview.mjs from ${{ github.base_ref }}"
          else
            echo "::warning::Preview script is not on the base branch yet; using this PR's bootstrap copy"
          fi

      - name: Delete preview
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_TEMPLATE_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: node scripts/dokploy-preview.mjs teardown

      - name: Comment teardown
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- dokploy-preview -->';
            const body = `${marker}\n🧹 Preview environment for this PR was removed.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            }
